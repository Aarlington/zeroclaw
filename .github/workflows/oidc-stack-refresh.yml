name: OIDC stack refresh validation
on:
  push:
    branches: [codex/oidc-refresh-validation-20261009]
permissions:
  contents: read
concurrency:
  group: oidc-stack-refresh-validation
  cancel-in-progress: true
jobs:
  regression:
    if: github.repository == 'Aarlington/zeroclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: '32a84bc8322bd1b39cad3dda365e5b07f21f74a2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: ./.github/actions/rust-cache
        with:
          use-blacksmith: 'false'
          cache-on-failure: true
          shared-key: oidc-stack-refresh
      - name: Install linker
        run: bash scripts/ci/apt_install.sh mold
      - name: Verify source and run regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p refresh-evidence web/dist
          touch web/dist/.gitkeep
          git rev-parse HEAD > refresh-evidence/validation-sha.txt
          git rev-parse "$SOURCE_SHA" > refresh-evidence/source-sha.txt
          git diff --exit-code "$SOURCE_SHA" -- . ':(exclude).github/workflows/oidc-stack-refresh.yml'
          cargo check --locked -p zeroclaw-runtime --tests 2>&1 | tee refresh-evidence/check.log
          cargo test --locked -p zeroclaw-config --lib live:: 2>&1 | tee refresh-evidence/config.log
          cargo test --locked -p zeroclaw-infra --lib session_ 2>&1 | tee refresh-evidence/storage.log
          cargo test --locked -p zeroclaw-runtime --lib rpc:: 2>&1 | tee refresh-evidence/rpc.log
          cargo test --locked -p zeroclaw-runtime --lib live_config_authority:: 2>&1 | tee refresh-evidence/authority.log
          cargo test --locked -p zeroclaw-runtime --lib principal 2>&1 | tee refresh-evidence/principal.log
          cargo test --locked -p zeroclaw-runtime --lib steering 2>&1 | tee refresh-evidence/steering.log
          cargo test --locked -p zeroclaw-runtime --lib enrollment 2>&1 | tee refresh-evidence/enrollment.log
          run_one() {
            local package="$1" case="$2"
            cargo test --locked -p "$package" --lib "$case" 2>&1 | tee "refresh-evidence/exact-$case.log"
            grep -Eq '^running 1 test$' "refresh-evidence/exact-$case.log"
            grep -Eq '^test result: ok. 1 passed; 0 failed; 0 ignored;' "refresh-evidence/exact-$case.log"
          }
          run_one zeroclaw-infra guarded_jsonl_append_requires_existing_authorized_session
          run_one zeroclaw-infra authorized_append_and_rename_hold_authority_through_commit
          run_one zeroclaw-runtime append_rechecks_authority_and_owner_after_the_real_agent_lock
          run_one zeroclaw-runtime remote_mutations_refuse_same_generation_tui_transfer
          run_one zeroclaw-runtime operator_abort_authorizes_after_the_real_cancellation_lock
          run_one zeroclaw-runtime create_only_retains_its_published_generation_after_late_removal
          run_one zeroclaw-runtime session_run_once_runs_one_turn_and_closes_its_session
          for suite in config storage rpc authority principal steering enrollment; do
            grep -Eq '^test result: ok. [1-9][0-9]* passed; 0 failed;' "refresh-evidence/$suite.log"
          done
          cargo clippy --locked -p zeroclaw-runtime -p zeroclaw-infra -p zeroclaw-config --all-targets -- -D warnings 2>&1 | tee refresh-evidence/clippy.log
      - name: Verify append regression sensitivity
        shell: bash
        run: |
          set -euo pipefail
          source=crates/zeroclaw-runtime/src/rpc/dispatch.rs
          backup=$(mktemp)
          cp "$source" "$backup"
          trap 'cp "$backup" "$source"; rm -f "$backup"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/zeroclaw-runtime/src/rpc/dispatch.rs')
          s = p.read_text()
          start = s.index('    async fn handle_session_append(')
          end = s.index('    async fn handle_session_rename(', start)
          target = s[start:end]
          a = target.index('                let authorize = |owner: Option<&str>| {')
          b = target.index('                let mut committed = || {', a)
          replacement = "                let authorize = |_: Option<&str>| -> std::io::Result<Box<dyn zeroclaw_infra::session_backend::SessionEffectGuard>> { Ok(Box::new(())) };\n"
          target = target[:a] + replacement + target[b:]
          p.write_text(s[:start] + target + s[end:])
          PY
          git diff -- "$source" > refresh-evidence/sensitivity-mutation.diff
          set +e
          cargo test --locked -p zeroclaw-runtime --lib append_rechecks_authority_and_owner_after_the_real_agent_lock 2>&1 | tee refresh-evidence/sensitivity-append.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 101
          grep -Eq '^running 1 test$' refresh-evidence/sensitivity-append.log
          grep -Eq '^test result: FAILED. 0 passed; 1 failed; 0 ignored;' refresh-evidence/sensitivity-append.log
          grep -F 'revoke:' refresh-evidence/sensitivity-append.log
          cp "$backup" "$source"
          git diff --exit-code "$SOURCE_SHA" -- . ':(exclude).github/workflows/oidc-stack-refresh.yml'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: oidc-stack-refresh-evidence
          path: refresh-evidence/
          retention-days: 7

  branch-check:
    if: github.repository == 'Aarlington/zeroclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - pr: '11408'
            source: 'f00fe86148ce4f2ea17c1613acfd6019475a8c1f'
          - pr: '11409'
            source: 'e4301c09e239963000c17f3987816ac1ffe7cbc7'
          - pr: '11410'
            source: '328b217a8553d2086c48451a561eff2aadbd6efd'
          - pr: '11411'
            source: '949c0bf70183d5a0be7885a302c81db10f44de55'
          - pr: '11422'
            source: '9e1bcf0ec73455ebc70660963ab57533ba42bc7c'
          - pr: '11423'
            source: '32a84bc8322bd1b39cad3dda365e5b07f21f74a2'
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.98.0
      - uses: ./.github/actions/rust-cache
        with:
          use-blacksmith: 'false'
          cache-on-failure: true
          shared-key: oidc-stack-refresh
      - name: Install linker
        run: bash scripts/ci/apt_install.sh mold
      - name: Check actual PR source and tests
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          mkdir -p refresh-evidence web/dist
          touch web/dist/.gitkeep
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git rev-parse HEAD > refresh-evidence/source-sha.txt
          cargo check --locked -p zeroclaw-runtime --tests 2>&1 | tee refresh-evidence/check.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: oidc-pr-${{ matrix.pr }}-check
          path: refresh-evidence/
          retention-days: 7
