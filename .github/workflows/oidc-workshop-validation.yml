name: OIDC SOP workshop permission validation

on:
  push:
    branches: [codex/oidc-sop-workshop-validation-20261014]

permissions:
  contents: read

concurrency:
  group: oidc-sop-workshop-validation
  cancel-in-progress: false

jobs:
  regressions:
    if: github.repository == 'Aarlington/zeroclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: ./.github/actions/rust-cache
        with:
          use-blacksmith: 'false'
          cache-on-failure: true
          shared-key: oidc-disposable-acceptance
      - name: Install linker
        run: bash scripts/ci/apt_install.sh mold
      - name: Verify exact production source and formatting
        run: |
          mkdir -p web/dist
          touch web/dist/.gitkeep
          git diff --exit-code 0494b14bd9a25471ae5c2d0c27ee224554a59524 -- . \
            ':(exclude).github/workflows/oidc-workshop-validation.yml' \
            ':(exclude)tests/manual/oidc_workshop_regressions.py'
          cargo fmt --all -- --check
      - name: Require old-code and alias failures then exact regression passes
        run: python3 tests/manual/oidc_workshop_regressions.py
      - name: Strict runtime and storage Clippy
        run: cargo clippy --locked -p zeroclaw-runtime -p zeroclaw-infra --lib --tests -- -D warnings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: oidc-workshop-regressions
          path: regression-evidence/
          retention-days: 7
