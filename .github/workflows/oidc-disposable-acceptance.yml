name: OIDC disposable acceptance

on:
  push:
    branches: [codex/oidc-two-provider-acceptance]

permissions:
  contents: read

concurrency:
  group: oidc-disposable-acceptance
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Aarlington/zeroclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
      - uses: ./.github/actions/rust-cache
        with:
          use-blacksmith: 'false'
          cache-on-failure: true
          shared-key: oidc-disposable-acceptance
      - name: Install linker
        run: bash scripts/ci/apt_install.sh mold
      - name: Build the shipped CLI and daemon
        run: |
          mkdir -p web/dist
          touch web/dist/.gitkeep
          cargo build --locked -p zeroclaw --bin zeroclaw
          mkdir -p acceptance-build
          cp target/debug/zeroclaw acceptance-build/zeroclaw
          git rev-parse HEAD > acceptance-build/source-sha.txt
          sha256sum acceptance-build/zeroclaw > acceptance-build/binary-sha256.txt
      - name: Prove regressions fail on the original combined source
        run: python3 tests/manual/oidc_baseline_regressions.py
      - name: Prove regressions pass on the repaired source
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            factory_delegate_inherits_private_memory_owner_before_any_action \
            sop_decide_rechecks_before_lookup_and_final_projection \
            session_configure_revoked_at_commit_changes_neither_overrides_nor_agent \
            selection_capture_finishes_while_a_writer_waits_for_an_effect_read; do
            cargo test --locked -p zeroclaw-runtime --lib "$test" 2>&1 | tee "acceptance-evidence/repaired-$test.log"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: oidc-regression-evidence
          path: acceptance-evidence/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-acceptance-binary
          path: acceptance-build/
          retention-days: 3

  real-providers:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        provider: [keycloak, authentik]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oidc-acceptance-binary
          path: acceptance-build
      - name: Install isolated browser test dependencies
        run: |
          python3 -m venv /tmp/oidc-test-venv
          /tmp/oidc-test-venv/bin/pip install playwright==1.58.0 websockets==15.0.1
          /tmp/oidc-test-venv/bin/playwright install --with-deps chromium
          chmod +x acceptance-build/zeroclaw
      - name: Exercise shipped CLI and daemon against real provider
        run: /tmp/oidc-test-venv/bin/python tests/manual/oidc_real_providers.py ${{ matrix.provider }} --binary acceptance-build/zeroclaw
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: oidc-${{ matrix.provider }}-evidence
          path: provider-evidence/
          retention-days: 7
