name: OIDC disposable acceptance

on:
  push:
    branches: [codex/oidc-two-provider-acceptance]

permissions:
  contents: read
  actions: read

concurrency:
  group: oidc-disposable-acceptance
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Aarlington/zeroclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify unchanged reviewed production source
        run: git diff --exit-code aaa681d085c9cc4f2b2e6e1071b3a97b1053ec23 -- . ':!tests/manual/**' ':!.github/workflows/oidc-disposable-acceptance.yml'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oidc-acceptance-binary
          path: acceptance-build
          run-id: 36957374376
          github-token: ${{ github.token }}
      - name: Verify tested binary provenance
        run: |
          test "$(cat acceptance-build/source-sha.txt)" = 2ac574da0c802968889dc1d35aca51f0ab7f693b
          sha256sum --check acceptance-build/binary-sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-acceptance-binary
          path: acceptance-build/
          retention-days: 3

  real-providers:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        provider: [keycloak, authentik]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oidc-acceptance-binary
          path: acceptance-build
      - name: Install isolated browser test dependencies
        run: |
          python3 -m venv /tmp/oidc-test-venv
          /tmp/oidc-test-venv/bin/pip install playwright==1.58.0 websockets==15.0.1
          /tmp/oidc-test-venv/bin/playwright install --with-deps chromium
          chmod +x acceptance-build/zeroclaw
      - name: Exercise shipped CLI and daemon against real provider
        run: /tmp/oidc-test-venv/bin/python tests/manual/oidc_real_providers.py ${{ matrix.provider }} --binary acceptance-build/zeroclaw
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: oidc-${{ matrix.provider }}-evidence
          path: provider-evidence/
          retention-days: 7
